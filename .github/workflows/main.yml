name: CI
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}" > ~/.npmrc
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      - run: yarn
      - run: yarn build && yarn lint

  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      postgres:
        image: postgres
        env:
          POSTGRES_DB: "steveo_testing"
          POSTGRES_HOST_AUTH_METHOD: "trust"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 24.x]
        experimental: [false]
        include:
          - node-version: 26.x
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: "Setup Localstack"
        run: |
          export IMAGE_NAME=localstack/localstack:4.14.0
          pip install localstack==4.14.0 awscli-local[ver1]
          docker pull localstack/localstack:4.14.0
          docker run --name kafka --network=host -d -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092 -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@127.0.0.1:9093 -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 -e KAFKA_NUM_PARTITIONS=1 apache/kafka:latest
          localstack start -d
          localstack wait -t 30
          echo "Startup complete"
      - name: Configure NPM
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_AUTH_TOKEN }}" > ~/.npmrc
        env:
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
      - name: Yarn install
        # The experimental leg runs ahead of the engines range, so skip the check there.
        run: yarn install --frozen-lockfile --no-progress ${{ matrix.experimental && '--ignore-engines' || '' }}
      - name: Initialise postgres instance
        run: ./bin/initialise.sh
      - name: Migrate (publish) db schema
        run: |
          pushd packages/storage-postgres
          npx prisma migrate deploy
          popd
        env:
          DATABASE_URL: postgresql://steveo@localhost:5432/steveo_testing
      - name: "Run tests"
        run: yarn test
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          DATABASE_URL: postgresql://steveo@localhost:5432/steveo_testing
